<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SERVICIAL - Postulación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --azul:#0B4C8C; --azul-osc:#083a6b; --azul-claro:#e8f0f9;
  --gris:#5a6472; --gris-claro:#f4f6f9; --borde:#dbe2ea;
  --verde:#1e8e5a; --amarillo:#c9861d; --rojo:#c0392b;
  --blanco:#ffffff;
  box-sizing:border-box;
}
*{box-sizing:inherit}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--gris-claro);color:#1a2430;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.app{max-width:680px;margin:0 auto;min-height:100vh;background:var(--blanco);display:flex;flex-direction:column;}
header.top{background:var(--blanco);color:var(--azul-osc);border-bottom:2px solid var(--azul);padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;}
header.top .logo{font-weight:700;font-size:1.25rem;letter-spacing:.5px;color:var(--azul-osc)}
header.top .sub{font-size:.78rem;color:var(--gris)}
header.top .logo-img{height:30px;display:block}
main{flex:1;padding:24px 20px 100px}
.progress-wrap{padding:10px 20px 0}
.progress-bar{height:6px;background:var(--borde);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--azul);transition:width .25s}
.progress-label{font-size:.8rem;color:var(--gris);margin-top:6px}
h1{font-size:1.3rem;margin:0 0 8px;color:var(--azul-osc)}
h2{font-size:1.15rem;margin:0 0 14px;color:#1a2430}
p.lead{color:var(--gris);line-height:1.5}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-size:.88rem;font-weight:600;margin:14px 0 6px;color:#33404d}
input[type=text],input[type=tel],input[type=email],select{
  width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:8px;font-size:1rem;background:#fff;
}
input:focus,select:focus{outline:2px solid var(--azul);outline-offset:1px}
.opciones{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.opcion{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--borde);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s}
.opcion:hover{border-color:var(--azul)}
.opcion.selected{border-color:var(--azul);background:var(--azul-claro)}
.opcion input{margin-top:3px}
.opcion span{font-size:.96rem;line-height:1.4}
.btns{display:flex;gap:12px;margin-top:24px}
button{font-size:1rem;font-weight:600;border-radius:10px;padding:14px 22px;border:none;cursor:pointer;transition:.15s}
.btn-primary{background:var(--azul);color:#fff;flex:1}
.btn-primary:disabled{background:#a9bdd4;cursor:not-allowed}
.btn-primary:not(:disabled):hover{background:var(--azul-osc)}
.btn-secondary{background:#fff;color:var(--azul);border:1.5px solid var(--azul);}
.btn-link{background:none;color:var(--azul);text-decoration:underline;padding:6px}
.footer-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;display:flex;gap:12px;}
.pill{display:inline-block;background:var(--azul-claro);color:var(--azul-osc);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.checkgrid{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.checkopt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--borde);border-radius:10px;padding:12px 14px}
.checkopt.selected{border-color:var(--azul);background:var(--azul-claro)}
.thankyou{text-align:center;padding:60px 20px}
.thankyou .icon{font-size:3rem;margin-bottom:16px}
.hidden{display:none !important}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--borde)}
th{color:var(--gris);font-weight:700;font-size:.72rem;text-transform:uppercase}
.badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge.apto{background:#e3f6ec;color:var(--verde)}
.badge.revision{background:#fdf2df;color:var(--amarillo)}
.badge.no{background:#fbe9e7;color:var(--rojo)}
.adminbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.adminbar input,.adminbar select{width:auto;flex:1;min-width:140px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--azul-claro);border-radius:10px;padding:14px}
.stat .n{font-size:1.6rem;font-weight:800;color:var(--azul-osc)}
.stat .l{font-size:.75rem;color:var(--gris)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:16px 16px 0 0;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:22px}
@media(min-width:720px){.modal-bg{align-items:center}.modal{border-radius:16px}}
a.linklike{color:var(--azul);cursor:pointer;font-weight:600;font-size:.85rem}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){}}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px}
  #printArea h2{color:#0B4C8C;margin-bottom:2px}
  #printArea table{width:100%;border-collapse:collapse;font-size:11px}
  #printArea th,#printArea td{border:1px solid #ccc;padding:5px 7px;text-align:left}
  #printArea th{background:#e8f0f9}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ================= DATOS DE CONFIGURACIÓN ================= */
const CARGOS = ["Pistero/a","Cajero/a de minimercado","Encargado/a de estación","Reponedor/a","Limpiador/a","Chofer","Administrativo/a","Cocinero/a","Supervisor/a","Otros"];

const PESOS = { responsabilidad:15, integridad:20, cliente:10, procedimientos:10, equipo:10, problemas:10, criterio:10, adaptabilidad:5, organizacion:5, aprendizaje:5 };

// puntos por opción: 0 (peor) a 3 (mejor). critico:true marca conducta a revisar por RRHH.
function op(texto,puntos,critico){ return {texto,puntos,critico:!!critico}; }

const GENERALES = [
{id:"g1",competencia:"responsabilidad",consistencia:"resp",texto:"Terminás tu turno y detectás que quedó una tarea pendiente que corresponde al turno siguiente. ¿Qué hacés?",opciones:[
  op("Mando un mensaje por el grupo de trabajo contando lo que quedó pendiente, y me voy.",2),
  op("Hablo cara a cara con el compañero que entra y me quedo hasta confirmar que entendió lo que falta.",3),
  op("Me quedo unos minutos extra, sin que nadie me lo pida, para terminarlo yo mismo.",2),
  op("Lo anoto en el cuaderno de novedades, dando por hecho que el próximo turno lo va a leer.",1)]},
{id:"g2",competencia:"integridad",consistencia:"hon",texto:"Un compañero te pide que registres una operación que él olvidó registrar porque ya está terminando su turno. ¿Qué hacés?",opciones:[
  op("Se la cargo yo a mi nombre para que no se complique, y le digo que la próxima se fije antes de irse.",0,true),
  op("Me quedo con él un momento y lo ayudo a que la registre él mismo antes de retirarse.",3),

  op("Le pido disculpas por la demora y me pongo a resolver su pedido lo más rápido posible.",3),
  op("Le explico que hay mucha gente y que tiene que esperar como los demás.",1),
  op("Llamo a un compañero para que lo atienda, ya que yo estoy con otra cosa en ese momento.",2),
  op("Le digo que entiendo la molestia, pero que hay que respetar el orden de llegada.",3)]},
{id:"g4",competencia:"responsabilidad",consistencia:"resp",texto:"Si cometés un error que todavía nadie detectó, ¿qué hacés?",opciones:[
  op("Reviso con calma qué tan grave es antes de decidir si aviso o no.",1),

  op("Lo corrijo yo mismo si puedo, y si no puedo, recién ahí aviso.",3),
  op("Espero un poco a ver si se nota solo, mientras pienso cómo explicarlo por si preguntan.",0,true)]},
{id:"g5",competencia:"procedimientos",texto:"Hay mucho apuro y un procedimiento habitual te haría perder unos minutos. ¿Qué hacés?",opciones:[

  op("Consulto rápido con el encargado si en este caso se puede simplificar algo.",3),
  op("Salteo el procedimiento esta vez, ya que no parece haber mayor riesgo en esta situación puntual.",0,true)]},
{id:"g6",competencia:"equipo",texto:"Un compañero está sobrecargado y vos ya terminaste tu tarea. Todavía quedan tareas del turno. ¿Qué hacés?",opciones:[
  op("Le pregunto directamente si necesita que lo ayude con algo.",3),
  op("Me pongo a ayudarlo sin preguntar, asumiendo que seguro necesita una mano.",3),
  op("Aviso al encargado de la situación, para que decida cómo repartir el trabajo.",2),
  op("Me quedo disponible por si me llegan a necesitar, pero sigo con otras cosas mías mientras tanto.",1)]},
{id:"g7",competencia:"criterio",texto:"Recibís una instrucción que te parece que puede estar equivocada. ¿Qué hacés?",opciones:[

  op("Antes de actuar, pregunto para confirmar si es correcta y explico por qué me genera dudas.",3),
  op("La cumplo, pero hago algunos ajustes menores según mi criterio, sin comentarlo.",0,true),
  op("Primero termino otras tareas y dejo esta para el final, esperando que mientras tanto se aclare.",1)]},
{id:"g8",competencia:"presion",texto:"Tenés varios clientes esperando, poco personal y una tarea urgente que te pidieron. ¿Cómo actuás?",opciones:[

{id:"g12",competencia:"aprendizaje",texto:"Un compañero te señala un error delante de otros trabajadores. ¿Cómo reaccionás?",opciones:[

{id:"g15",competencia:"procedimientos",texto:"Un compañero te dice que en su turno anterior no se sigue tal cual un procedimiento porque «se pierde tiempo». ¿Qué hacés?",opciones:[

  op("Empiezo a saltear los mismos pasos, ya que si a él no le trajo problemas, no debería traerme a mí tampoco.",0,true)]},
{id:"g16",competencia:"equipo",texto:"Tenés un desacuerdo con un compañero sobre cómo hacer una tarea. ¿Qué hacés?",opciones:[
  op("Le explico mi punto de vista y trato de llegar a un acuerdo con él sobre la mejor forma de hacerlo.",3),
  op("Si no logramos ponernos de acuerdo rápido, se lo consulto al encargado para que decida.",3),
  op("Termino cediendo a su forma, aunque no estoy del todo convencido, para no entrar en conflicto.",1),
  op("Sigo con mi forma de hacerlo, ya que tengo bastante confianza en que es la correcta.",1)]}
];

const ROLE_QUESTIONS = {
"Cajero/a de minimercado":[
 {id:"caj1",competencia:"integridad",texto:"Al cerrar caja notás una diferencia pequeña de dinero. ¿Qué hacés?",opciones:[

/* ================= ESTADO ================= */
let state = { screen:"home", candidato:{}, respuestas:{}, preguntas:[], idx:0, adminAuth:false, adminView:"dashboard", adminFiltro:{cargo:"",resultado:"",q:""} };

function loadDB(){ try{ return JSON.parse(localStorage.getItem("servicial_postulantes")||"[]"); }catch(e){ return []; } }
function saveDB(db){ localStorage.setItem("servicial_postulantes", JSON.stringify(db)); }

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= NAVEGACIÓN ================= */
function goto(screen){ state.screen=screen; render(); window.scrollTo(0,0); }

function iniciarPostulacion(cargo){
  state.candidato = { cargo };
  state.respuestas = {};
  const roleQs = ROLE_QUESTIONS[cargo]||[];
  state.preguntas = shuffle(GENERALES).concat(roleQs).map(q=>({...q, opcionesShuffled: shuffle(q.opciones)}));
  state.idx = 0;
  goto("datos");
}

/* ================= SCORING ================= */
function calcularResultado(){
  const porComp = {}; Object.keys(PESOS).forEach(k=>porComp[k]={max:0,obt:0});
  let criticos = 0;
  const consist = {};
  state.preguntas.forEach(q=>{
    const sel = state.respuestas[q.id];
    if(!sel) return;
    if(!porComp[q.competencia]) porComp[q.competencia]={max:0,obt:0};
    porComp[q.competencia].max += 3;
    porComp[q.competencia].obt += sel.puntos;
    if(sel.critico) criticos++;
    if(q.consistencia){
      if(!consist[q.consistencia]) consist[q.consistencia]=[];
      consist[q.consistencia].push(sel.puntos);
    }
  });
  let total = 0; const detalle = {};
  Object.keys(PESOS).forEach(k=>{
    const c = porComp[k];
    const ratio = c.max>0 ? c.obt/c.max : 0.5;
    const pts = Math.round(ratio*PESOS[k]*10)/10;
    detalle[k] = { obtenido: pts, maximo: PESOS[k] };
    total += pts;
  });
  total = Math.round(total*10)/10;

  let diffs = [];
  Object.values(consist).forEach(arr=>{ if(arr.length>=2){ diffs.push(Math.abs(arr[0]-arr[1])); } });
  let avgDiff = diffs.length ? diffs.reduce((a,b)=>a+b,0)/diffs.length : 0;
  let consistencia = avgDiff<=0.5 ? "ALTO" : avgDiff<=1.5 ? "MEDIO" : "BAJO";

  let resultado;
  if(total>=80) resultado="APTO PARA AVANZAR";
  else if(total>=65) resultado="REVISIÓN DE RRHH";
  else resultado="NO AVANZA";

  if(criticos>=CRITICOS_UMBRAL_NOAVANZA) resultado="NO AVANZA";
  else if(criticos>=CRITICOS_UMBRAL_REVISION && resultado==="APTO PARA AVANZAR") resultado="REVISIÓN DE RRHH";

  const ordenComp = Object.entries(detalle).sort((a,b)=> (b[1].obtenido/b[1].maximo) - (a[1].obtenido/a[1].maximo));
  const fortalezas = ordenComp.slice(0,3).map(e=>e[0]);
  const revisar = ordenComp.slice(-2).map(e=>e[0]);

  return { total, detalle, criticos, consistencia, resultado, fortalezas, revisar };
}

const NOMBRES_COMP = { responsabilidad:"Responsabilidad", integridad:"Integridad", cliente:"Orientación al cliente", procedimientos:"Cumplimiento de procedimientos", equipo:"Trabajo en equipo", problemas:"Resolución de problemas", criterio:"Criterio", adaptabilidad:"Adaptabilidad", organizacion:"Organización", aprendizaje:"Aprendizaje", presion:"Manejo de presión" };

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function enviarPostulacion(){
  const doc = state.candidato.documento;
  const db = loadDB();
  const yaExisteLocal = db.find(c=> c.documento===doc && (Date.now()-c.fecha) < DIAS_BLOQUEO_REPOSTULACION*24*3600*1000);
  if(!GAS_URL && yaExisteLocal){ goto("yaExiste"); return; }

  const res = calcularResultado();
  const { _cvFile, _cvNombre, ...candidatoLimpio } = state.candidato;
  const registro = { id:"P"+Date.now(), fecha:Date.now(), ...candidatoLimpio, cvNombre:_cvNombre||"", resultado:res.resultado, total:res.total, detalle:res.detalle, criticos:res.criticos, consistencia:res.consistencia, fortalezas:res.fortalezas, revisar:res.revisar, respuestas: Object.fromEntries(Object.entries(state.respuestas).map(([k,v])=>[k,v.texto])) };

  // Copia local de respaldo (siempre, sin el archivo del CV para no saturar el navegador).
  db.push(registro); saveDB(db);

  if(GAS_URL){
    goto("enviando");
    try{
      let cvBase64 = "";
      if(_cvFile){ cvBase64 = await fileToBase64(_cvFile); }
      const resp = await fetch(GAS_URL, { method:"POST", body: JSON.stringify({ mode:"submit", ...registro, cvBase64, cvMime:_cvFile?_cvFile.type:"" }) });
      const data = await resp.json();
      if(data.status === "duplicate"){ goto("yaExiste"); return; }
      if(data.status !== "ok"){ goto("errorEnvio"); return; }
    }catch(err){
      goto("errorEnvio"); return;
    }
  }
  goto("gracias");
}

/* ================= RENDER: CANDIDATO ================= */
function render(){
  const app = document.getElementById("app");
  if(state.screen==="admin" || state.screen==="adminLogin"){ app.innerHTML = renderAdmin(); attachAdminEvents(); return; }
  app.innerHTML = renderCandidato();
  attachCandidatoEvents();
}

function renderCandidato(){
  let body="";
  if(state.screen==="home") body = screenHome();
  else if(state.screen==="datos") body = screenDatos();
  else if(state.screen==="disponibilidad") body = screenDisponibilidad();
  else if(state.screen==="pregunta") body = screenPregunta();
  else if(state.screen==="gracias") body = screenGracias();
  else if(state.screen==="yaExiste") body = screenYaExiste();
  else if(state.screen==="enviando") body = screenEnviando();
  else if(state.screen==="errorEnvio") body = screenErrorEnvio();
  return `
  <header class="top">
    <div><img src="${LOGO_B64}" alt="SERVICIAL" class="logo-img"></div>
    <div class="sub" style="cursor:pointer;text-decoration:underline" onclick="window.__goAdminLogin()">RRHH</div>
  </header>
  ${body}`;
}

function screenHome(){
  return `<main>
    <span class="pill">Postulación online</span>
    <h1>Sumate al equipo SERVICIAL</h1>
    <p class="lead">Completá esta breve evaluación para postularte. Te tomará entre 8 y 12 minutos. Elegí el cargo al que querés postularte:</p>

function attachCandidatoEvents(){
  document.querySelectorAll("#cargoList .opcion").forEach(el=>{
    el.onclick = ()=> iniciarPostulacion(el.dataset.cargo);
  });
  const bd = document.getElementById("btnDatosNext");
  if(bd) bd.onclick = ()=>{
    const req = ["f_nombre","f_apellido","f_documento","f_telefono","f_localidad"];
    for(const id of req){ if(!document.getElementById(id).value.trim()){ document.getElementById(id).focus(); return; } }
    const cvInput = document.getElementById("f_cv");
    const cvFile = cvInput.files[0] || state.candidato._cvFile;
    if(!cvFile){ alert("Por favor adjuntá tu CV (PDF o Word) para continuar."); cvInput.focus(); return; }
    const extOk = /\.(pdf|doc|docx)$/i.test(cvFile.name);
    if(!extOk){ alert("El CV debe ser un archivo PDF o Word (.pdf, .doc, .docx)."); return; }
    if(cvFile.size > 5*1024*1024){ alert("El archivo pesa más de 5MB. Subí una versión más liviana."); return; }
    state.candidato._cvFile = cvFile;
    state.candidato._cvNombre = cvFile.name;
    state.candidato.nombre = val("f_nombre"); state.candidato.apellido = val("f_apellido");
    state.candidato.documento = val("f_documento"); state.candidato.telefono = val("f_telefono");
    state.candidato.email = val("f_email"); state.candidato.localidad = val("f_localidad");
    state.candidato.cargo = val("f_cargo");
    goto("disponibilidad");
  };
  document.querySelectorAll("#grpDisp .checkopt").forEach(el=>{
    el.onclick = ()=>{
      state.candidato.disponibilidad = state.candidato.disponibilidad||[];
      const v = el.dataset.val;
      const i = state.candidato.disponibilidad.indexOf(v);
      if(i>-1) state.candidato.disponibilidad.splice(i,1); else state.candidato.disponibilidad.push(v);
      render();
    };
  });
  document.querySelectorAll("#grpExp .opcion").forEach(el=>{
    el.onclick = ()=>{ state.candidato.experiencia = el.dataset.val; render(); };
  });
  const bdi = document.getElementById("btnDispNext");
  if(bdi) bdi.onclick = ()=>{
    state.candidato.expTexto = document.getElementById("f_expTexto")?document.getElementById("f_expTexto").value:"";
    goto("pregunta");
  };
  document.querySelectorAll("#opcList .opcion").forEach(el=>{
    el.onclick = ()=>{
      const q = state.preguntas[state.idx];
      state.respuestas[q.id] = q.opcionesShuffled[parseInt(el.dataset.i)];
      render();
    };
  });
  const bp = document.getElementById("btnPrev");
  if(bp) bp.onclick = ()=>{ if(state.idx>0){ state.idx--; render(); } else { goto("disponibilidad"); } };
  const bn = document.getElementById("btnNext");
  if(bn) bn.onclick = ()=>{
    if(state.idx < state.preguntas.length-1){ state.idx++; render(); }
    else { enviarPostulacion(); }
  };
}
function val(id){ return document.getElementById(id).value.trim(); }

/* ================= ADMIN ================= */
async function fetchAdminData(){
  if(!GAS_URL){ state.adminDB = loadDB(); render(); return; }
  state.adminLoading = true; render();
  try{
    const resp = await fetch(`${GAS_URL}?mode=list&token=${encodeURIComponent(ADMIN_PASS)}`);
    const data = await resp.json();
    if(data.status==="ok"){ state.adminDB = data.data.map(c=>({...c, fecha: new Date(c.fecha).getTime(), total:Number(c.total), criticos:Number(c.criticos)})); }
    else { state.adminDB = []; state.adminError = data.message||"Error al cargar datos"; }
  }catch(err){ state.adminDB = []; state.adminError = "No se pudo conectar con la planilla."; }
  state.adminLoading = false; render();
}

function renderAdmin(){
  if(!state.adminAuth) return adminLoginScreen();
  if(state.adminLoading) return `<header class="top"><img src="${LOGO_B64}" alt="SERVICIAL" class="logo-img"></header><main><p class="lead">Cargando postulantes...</p></main>`;
  const db = state.adminDB || [];
  if(state.adminError) return `<header class="top"><img src="${LOGO_B64}" alt="SERVICIAL" class="logo-img"></header><main><p class="lead">${state.adminError}</p><button class="btn-secondary" onclick="window.__adminRefresh()">Reintentar</button></main>`;
  let filtered = filtrarCandidatos(db);

  const stats = { total:db.length, apto:db.filter(c=>c.resultado==="APTO PARA AVANZAR").length, rev:db.filter(c=>c.resultado==="REVISIÓN DE RRHH").length, no:db.filter(c=>c.resultado==="NO AVANZA").length };

  return `
  <header class="top"><div><img src="${LOGO_B64}" alt="SERVICIAL" class="logo-img"></div><div class="sub" style="cursor:pointer;text-decoration:underline" onclick="window.__adminLogout()">Salir</div></header>
  <main>
    <div class="statgrid">
      <div class="stat"><div class="n">${stats.total}</div><div class="l">Total postulantes</div></div>
      <div class="stat"><div class="n">${stats.apto}</div><div class="l">Aptos</div></div>
      <div class="stat"><div class="n">${stats.rev}</div><div class="l">Revisión RRHH</div></div>
      <div class="stat"><div class="n">${stats.no}</div><div class="l">No avanza</div></div>
    </div>
    <div class="adminbar">
      <input type="text" id="admQ" placeholder="Buscar por nombre o documento" value="${state.adminFiltro.q}">
      <select id="admCargo"><option value="">Todos los cargos</option>${CARGOS.map(c=>`<option ${state.adminFiltro.cargo===c?'selected':''}>${c}</option>`).join("")}</select>
      <select id="admResultado"><option value="">Todos los resultados</option>
        <option ${state.adminFiltro.resultado==="APTO PARA AVANZAR"?'selected':''}>APTO PARA AVANZAR</option>
        <option ${state.adminFiltro.resultado==="REVISIÓN DE RRHH"?'selected':''}>REVISIÓN DE RRHH</option>
        <option ${state.adminFiltro.resultado==="NO AVANZA"?'selected':''}>NO AVANZA</option>
      </select>
      <button class="btn-secondary" id="admExport">Exportar CSV</button>
      <button class="btn-secondary" id="admExportXLSX">Exportar Excel</button>
      <button class="btn-secondary" id="admExportPDF">Exportar PDF</button>
      <button class="btn-secondary" id="admRefresh">Actualizar</button>
      <button class="btn-secondary" id="admDeleteAll" style="color:var(--rojo);border-color:var(--rojo)">Borrar todas (pruebas)</button>
    </div>
    ${GAS_URL ? '' : '<p class="lead" style="font-size:.78rem">Modo demo: mostrando datos guardados en este navegador (no hay planilla configurada).</p>'}
    <div class="card" style="overflow-x:auto">
    <table><thead><tr><th>Nombre</th><th>Cargo</th><th>Fecha</th><th>Puntaje</th><th>Resultado</th><th></th></tr></thead>
    <tbody>
    ${filtered.map(c=>`<tr>
      <td>${c.nombre} ${c.apellido}</td><td>${c.cargo}</td><td>${new Date(c.fecha).toLocaleDateString('es-UY')}</td>
      <td>${c.total}/100</td>
      <td><span class="badge ${badgeClass(c.resultado)}">${c.resultado}</span></td>
      <td><a class="linklike" data-id="${c.id}">Ver</a> &nbsp; <a class="linklike" style="color:var(--rojo)" data-del="${c.id}">Borrar</a></td>
    </tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--gris);padding:24px">Todavía no hay postulaciones registradas.</td></tr>`}
    </tbody></table>
    </div>
  </main>`;
}

function badgeClass(r){ return r==="APTO PARA AVANZAR"?"apto":r==="REVISIÓN DE RRHH"?"revision":"no"; }

  <main>
    <h2>Acceso RRHH</h2>
    <div class="card">
      <label>Contraseña</label>

      <div class="btns"><button class="btn-primary" id="admLoginBtn">Ingresar</button></div>
      <div class="btns"><button class="btn-link" onclick="window.__goto('home')">Volver a la postulación</button></div>
    </div>

function detalleModal(c){
  const comp = Object.entries(c.detalle).map(([k,v])=>`<tr><td>${NOMBRES_COMP[k]||k}</td><td>${v.obtenido}/${v.maximo}</td></tr>`).join("");
  return `<div class="modal-bg" id="modalBg"><div class="modal">
    <h2>${c.nombre} ${c.apellido}</h2>
    <p class="lead" style="margin-top:-8px">Documento: ${c.documento} · Cargo: ${c.cargo} · ${new Date(c.fecha).toLocaleString('es-UY')}</p>
    <p><span class="badge ${badgeClass(c.resultado)}">${c.resultado}</span> &nbsp; Puntaje: <b>${c.total}/100</b></p>
    <table>${comp}</table>
    <p style="margin-top:14px"><b>Indicador de consistencia:</b> ${c.consistencia}</p>
    <p><b>Respuestas críticas detectadas:</b> ${c.criticos}</p>
    <p><b>Fortalezas:</b> ${c.fortalezas.map(f=>NOMBRES_COMP[f]||f).join(", ")}</p>
    <p><b>Aspectos a revisar:</b> ${c.revisar.map(f=>NOMBRES_COMP[f]||f).join(", ")}</p>
    <p class="lead" style="font-size:.8rem">Disponibilidad: ${(c.disponibilidad||[]).join(", ")||"-"} · Experiencia: ${c.experiencia||"-"}</p>
    <p>${c.cvURL ? `<a class="linklike" href="${c.cvURL}" target="_blank" rel="noopener">📄 Ver / descargar CV</a>` : '<span class="lead" style="font-size:.82rem">No se recibió CV adjunto.</span>'}</p>
    <div class="btns">
      <button class="btn-secondary" id="closeModal" style="width:100%">Cerrar</button>
      <button class="btn-secondary" id="delFromModal" data-id="${c.id}" style="width:100%;color:var(--rojo);border-color:var(--rojo)">Borrar postulación</button>
    </div>
  </div></div>`;
}

function filtrarCandidatos(db){
  return db.filter(c=>{
    if(state.adminFiltro.cargo && c.cargo!==state.adminFiltro.cargo) return false;
    if(state.adminFiltro.resultado && c.resultado!==state.adminFiltro.resultado) return false;
    if(state.adminFiltro.q){
      const q = state.adminFiltro.q.toLowerCase();
      if(!(`${c.nombre} ${c.apellido} ${c.documento}`.toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a,b)=>b.total-a.total);
}

function filasExport(){
  const db = filtrarCandidatos(state.adminDB || []);
  return db.map(c=>({
    "Nombre": c.nombre+" "+c.apellido,
    "Documento": c.documento,
    "Teléfono": c.telefono,
    "Email": c.email||"",
    "Localidad": c.localidad||"",
    "Cargo": c.cargo,
    "Fecha": new Date(c.fecha).toLocaleString('es-UY'),
    "Puntaje": c.total,
    "Resultado": c.resultado,
    "Respuestas críticas": c.criticos,
    "Consistencia": c.consistencia,
    "Disponibilidad": (c.disponibilidad||[]).join(", "),
    "Experiencia": c.experiencia||"",
    "CV": c.cvURL||""
  }));
}

function exportXLSX(){
  const filas = filasExport();
  if(!filas.length){ alert("No hay postulantes para exportar con estos filtros."); return; }
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Postulantes");
  XLSX.writeFile(wb, "postulantes_servicial.xlsx");
}

function exportPDF(){
  const filas = filasExport();
  if(!filas.length){ alert("No hay postulantes para exportar con estos filtros."); return; }
  const cols = Object.keys(filas[0]);
  let html = `<img src="${LOGO_B64}" style="height:36px;margin-bottom:10px">
    <h2>Postulantes SERVICIAL</h2>
    <p style="color:#5a6472;font-size:12px">Generado el ${new Date().toLocaleString('es-UY')} · ${filas.length} postulante(s)</p>
    <table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>
    ${filas.map(f=>`<tr>${cols.map(c=>`<td>${f[c]}</td>`).join("")}</tr>`).join("")}
    </tbody></table>`;
  let area = document.getElementById("printArea");
  if(!area){ area = document.createElement("div"); area.id="printArea"; document.body.appendChild(area); }
  area.innerHTML = html;
  window.print();
}

function exportCSV(){
  const filas = filasExport();
  if(!filas.length){ alert("No hay postulantes para exportar con estos filtros."); return; }
  const headers = Object.keys(filas[0]);
  const rows = filas.map(f=> headers.map(h=>{
    const v = String(f[h]??"").replace(/"/g,'""');
    return `"${v}"`;
  }).join(","));
  const csv = headers.join(",")+"\n"+rows.join("\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="postulantes_servicial.csv"; a.click();
  URL.revokeObjectURL(url);
}

window.__adminLogout = ()=>{ state.adminAuth=false; goto("home"); };
window.__adminRefresh = ()=> fetchAdminData();

async function borrarPostulacion(id){
  if(!confirm("¿Borrar esta postulación? Esta acción no se puede deshacer.")) return;
  if(GAS_URL){
    try{
      await fetch(GAS_URL, { method:"POST", body: JSON.stringify({ mode:"delete", id, token: ADMIN_PASS }) });
    }catch(err){ alert("No se pudo borrar (revisá tu conexión)."); return; }
  } else {
    const db = loadDB().filter(c=>c.id!==id); saveDB(db);
  }
  fetchAdminData();
}

async function borrarTodasPostulaciones(){
  if(!confirm("¿Seguro que querés borrar TODAS las postulaciones? Pensado para limpiar datos de prueba. Esta acción no se puede deshacer.")) return;
  if(!confirm("Confirmá de nuevo: se van a borrar todos los registros.")) return;
  if(GAS_URL){
    try{
      await fetch(GAS_URL, { method:"POST", body: JSON.stringify({ mode:"deleteAll", token: ADMIN_PASS }) });
    }catch(err){ alert("No se pudo borrar (revisá tu conexión)."); return; }
  } else {
    saveDB([]);
  }
  fetchAdminData();
}

function attachAdminEvents(){
  const lb = document.getElementById("admLoginBtn");
  if(lb) lb.onclick = ()=>{
    if(document.getElementById("admPass").value === ADMIN_PASS){ state.adminAuth=true; state.screen="admin"; fetchAdminData(); }
    else alert("Contraseña incorrecta");
  };
  const q = document.getElementById("admQ"); if(q) q.oninput = ()=>{ state.adminFiltro.q=q.value; render(); };
  const cg = document.getElementById("admCargo"); if(cg) cg.onchange = ()=>{ state.adminFiltro.cargo=cg.value; render(); };
  const rs = document.getElementById("admResultado"); if(rs) rs.onchange = ()=>{ state.adminFiltro.resultado=rs.value; render(); };
  const ex = document.getElementById("admExport"); if(ex) ex.onclick = exportCSV;
  const exx = document.getElementById("admExportXLSX"); if(exx) exx.onclick = exportXLSX;
  const exp = document.getElementById("admExportPDF"); if(exp) exp.onclick = exportPDF;
  const rf = document.getElementById("admRefresh"); if(rf) rf.onclick = ()=> fetchAdminData();
  const da = document.getElementById("admDeleteAll"); if(da) da.onclick = borrarTodasPostulaciones;
  document.querySelectorAll("a.linklike[data-id]").forEach(a=>{
    a.onclick = ()=>{
      const db = state.adminDB || []; const c = db.find(x=>x.id===a.dataset.id);
      const div = document.createElement("div"); div.innerHTML = detalleModal(c);
      document.body.appendChild(div);
      document.getElementById("closeModal").onclick = ()=> div.remove();
      document.getElementById("modalBg").onclick = (e)=>{ if(e.target.id==="modalBg") div.remove(); };
      document.getElementById("delFromModal").onclick = ()=>{ div.remove(); borrarPostulacion(c.id); };
    };
  });
  document.querySelectorAll("a.linklike[data-del]").forEach(a=>{
    a.onclick = ()=> borrarPostulacion(a.dataset.del);
  });
}

render();
